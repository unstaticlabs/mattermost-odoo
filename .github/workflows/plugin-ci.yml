name: Mattermost plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mattermost-plugin
    env:
      CI: true
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source and version tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up declared Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mattermost-plugin/go.mod
          cache-dependency-path: mattermost-plugin/go.sum
      - name: Set up declared Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1
        with:
          node-version-file: mattermost-plugin/.nvmrc
          cache: npm
          cache-dependency-path: mattermost-plugin/webapp/package-lock.json
      - name: Prepare native manifests
        run: make manifest-check apply
      - name: Vet and race-test Go packages
        run: |
          go vet -mod=readonly ./server/... ./build/...
          go test -mod=readonly -race ./server/... ./build/...
      - name: Install locked frontend dependencies
        run: npm ci --prefix webapp
      - name: Lint and typecheck the frontend
        run: |
          npm run lint --prefix webapp
          npm run check-types --prefix webapp
      - name: Test the frontend
        run: npm run test-ci --prefix webapp -- --ci
      - name: Build the native Linux bundle
        run: make usl-dist
      - name: Verify the installable bundle
        run: python3 scripts/verify-usl-bundle.py dist/*.tar.gz
      - name: Retain the qualified bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mattermost-odoo-${{ github.sha }}
          path: mattermost-plugin/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
